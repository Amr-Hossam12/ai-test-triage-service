<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Test Failure Triage</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e38; --text: #e6e8ec; --muted: #9aa2b1;
    --accent: #5b8def;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f8; --panel: #ffffff; --border: #dfe3ea; --text: #1a1d24; --muted: #5b6472; --accent: #2f6fed; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  select, button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: calc(100vh - 57px); }
  #list { overflow-y: auto; border-right: 1px solid var(--border); }
  #detail { overflow-y: auto; padding: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 14px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); }
  td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); cursor: pointer; }
  tr:hover td { background: var(--panel); }
  tr.selected td { background: var(--panel); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-SITE_RENDERING_ISSUE { background: #3a2f0f; color: #e0b84a; }
  .badge-UI_OVERLAY_BLOCKING { background: #1f3a2f; color: #4ae08a; }
  .badge-ASSERTION_MISMATCH { background: #2f2a3a; color: #b199e0; }
  .badge-LOCATOR_BROKEN { background: #3a1f2a; color: #e04a8a; }
  .badge-UNKNOWN { background: #2a2e38; color: var(--muted); }
  .muted { color: var(--muted); }
  h2 { font-size: 16px; margin: 0 0 4px; }
  .section { margin-bottom: 18px; }
  .section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 6px; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 12px; max-height: 220px; overflow: auto; }
  img { max-width: 100%; border: 1px solid var(--border); border-radius: 6px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>AI Test Failure Triage</h1>
  <select id="projectFilter"><option value="">All projects</option></select>
  <button id="refreshBtn">Refresh</button>
</header>
<main>
  <div id="list"><table><thead><tr><th>Time</th><th>Project</th><th>Test</th><th>Classification</th></tr></thead><tbody id="tbody"></tbody></table></div>
  <div id="detail"><div class="empty">Select a failure to view its analysis</div></div>
</main>
<script>
let cases = [];
let selectedId = null;

async function load() {
  const projectId = document.getElementById('projectFilter').value;
  const url = '/api/failures' + (projectId ? ('?projectId=' + encodeURIComponent(projectId)) : '');
  const res = await fetch(url);
  cases = await res.json();

  const projects = [...new Set(cases.map(c => c.projectId))];
  const filterEl = document.getElementById('projectFilter');
  const current = filterEl.value;
  filterEl.innerHTML = '<option value="">All projects</option>' +
    projects.map(p => `<option value="${p}">${p}</option>`).join('');
  filterEl.value = current;

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = cases.map(c => `
    <tr data-id="${c.id}" class="${c.id === selectedId ? 'selected' : ''}">
      <td class="muted">${new Date(c.timestamp).toLocaleString()}</td>
      <td>${c.projectId}</td>
      <td>${escapeHtml(c.testName)}</td>
      <td><span class="badge badge-${c.classification}">${c.classification}</span></td>
    </tr>`).join('') || '';

  if (cases.length === 0) {
    tbody.innerHTML = '';
    document.getElementById('list').querySelector('table').style.display = 'none';
  } else {
    document.getElementById('list').querySelector('table').style.display = '';
  }

  tbody.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => selectCase(tr.dataset.id));
  });
}

function selectCase(id) {
  selectedId = id;
  const c = cases.find(x => x.id === id);
  document.querySelectorAll('#tbody tr').forEach(tr => tr.classList.toggle('selected', tr.dataset.id === id));
  const detail = document.getElementById('detail');
  if (!c) { detail.innerHTML = '<div class="empty">Not found</div>'; return; }

  detail.innerHTML = `
    <h2>${escapeHtml(c.testName)}</h2>
    <p class="muted">${c.projectId} &middot; ${new Date(c.timestamp).toLocaleString()}</p>
    <div class="section">
      <h3>Classification</h3>
      <span class="badge badge-${c.classification}">${c.classification}</span>
    </div>
    <div class="section">
      <h3>Exception</h3>
      <pre>${escapeHtml(c.exceptionType)}: ${escapeHtml(c.exceptionMessage)}</pre>
    </div>
    <div class="section">
      <h3>Reasoning</h3>
      <pre>${escapeHtml(c.reasoning)}</pre>
    </div>
    <div class="section">
      <h3>Suggested next step</h3>
      <pre>${escapeHtml(c.suggestion)}</pre>
    </div>
    ${c.hasScreenshot ? `<div class="section"><h3>Screenshot</h3><img src="/api/screenshots/${c.id}"></div>` : ''}
    <div class="section">
      <h3>Page/response snippet</h3>
      <pre>${escapeHtml(c.pageSourceSnippet)}</pre>
    </div>
  `;
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

document.getElementById('refreshBtn').addEventListener('click', load);
document.getElementById('projectFilter').addEventListener('change', load);
load();
</script>
</body>
</html>
